<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>事件详情 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html" class="亮">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>事件详情</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <button class="按钮" type="button" id="查">查询</button>
  <a class="按钮 次" id="去回放" href="/投递流水.html">去投递流水回放</a>
  <p class="说明">事件详情与队列、流水、互证同源；其中 <code>尝试</code> 为正式投递集，<code>回放旁路</code> 为不计水位的影子账册。</p>
  <pre id="出" class="说明 结果盒"></pre>
</section>

  </main>

<script>
async function 查询() {
  try {
    const id = document.getElementById('事件号').value.trim();
    if (!id) { document.getElementById('出').textContent = '请输入事件号，或从事件队列点「详情/策略」进入。'; return; }
    const j = await 投递台.getJSON('/api/事件/'+encodeURIComponent(id));
    document.getElementById('出').textContent = JSON.stringify(j, null, 2);
    document.getElementById('去回放').href = '/投递流水.html';
  } catch (e) { document.getElementById('出').textContent = e.message; }
}
document.getElementById('查').onclick = 查询;
(function 自填(){
  const q = new URLSearchParams(location.search);
  const id = q.get('事件号') || q.get('id') || q.get('eid');
  if (id) { document.getElementById('事件号').value = id; 查询(); }
})();
</script>

</body>
</html>
